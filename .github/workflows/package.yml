name: package
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad tag: $VERSION"; exit 1; }
          for n in ${VERSION//./ }; do (( 10#$n <= 65535 )) || { echo "Version part too large: $n"; exit 1; }; done
          npm pkg set version="$VERSION"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.argv[1];fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')" "$VERSION"

      - name: Stage files
        run: |
          mkdir dist
          cp -r manifest.json *.js *.css popup.html LICENSE icons lib dist/

      # The artifact download is itself a zip of dist/ with manifest.json at its root,
      # so it can be uploaded to the Chrome Web Store as is.
      - uses: actions/upload-artifact@v4
        with:
          name: tidy-watch-later-${{ github.ref_name }}
          path: dist/
          overwrite: true
